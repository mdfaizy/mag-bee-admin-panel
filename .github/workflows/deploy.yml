name: Deploy Admin Next.js

on:
  push:
    branches:
      - next-faizy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.10

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

          command_timeout: 20m

          script: |
            set -e

            echo "========================================="
            echo "🚀 START NEXT.JS ADMIN DEPLOY"
            echo "========================================="

            # =========================================
            # NODE / NVM
            # =========================================

            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            else
              echo "❌ NVM not found"
              exit 1
            fi

            nvm use 22

            echo "✅ NODE CHECK"

            node -v
            npm -v
            which node
            which npm

            # =========================================
            # PROJECT DIRECTORY
            # =========================================

            APP_DIR="/var/www/magbeeadmin.magaritatech.com"

            cd "$APP_DIR"

            echo "📂 Current directory:"
            pwd

            # =========================================
            # GIT
            # =========================================

            echo "📥 Pull latest code"

            git config --global --add safe.directory "$APP_DIR"

            git fetch origin

            git reset --hard origin/next-faizy

            echo "📌 Current commit:"

            git log -1 --oneline

            # =========================================
            # ENV CHECK
            # =========================================

            echo "🔐 Checking .env"

            if [ ! -f ".env" ]; then
              echo "❌ ERROR: .env file not found"
              exit 1
            fi

            echo "✅ .env exists"

            # =========================================
            # CLEAN OLD BUILD
            # =========================================

            echo "🧹 Cleaning old Next.js build"

            rm -rf .next

            rm -rf node_modules/.cache

            # =========================================
            # INSTALL DEPENDENCIES
            # =========================================

            echo "📦 Installing dependencies"

            if [ -f "package-lock.json" ]; then
              npm ci
            else
              npm install
            fi

            echo "✅ Dependencies installed"

            # =========================================
            # BUILD
            # =========================================

            echo "🏗 Building Next.js app"

            NODE_OPTIONS="--max-old-space-size=4096" npm run build

            echo "✅ Next.js build completed"

            # =========================================
            # PM2
            # =========================================

            echo "🔄 Restarting PM2"

            if pm2 describe admin-next > /dev/null 2>&1; then

              echo "♻️ Existing PM2 process found"

              pm2 restart admin-next --update-env

            else

              echo "🆕 PM2 process not found"

              pm2 start npm \
                --name "admin-next" \
                --cwd "$APP_DIR" \
                -- start

            fi

            # =========================================
            # SAVE PM2
            # =========================================

            echo "💾 Saving PM2"

            pm2 save --force

            # =========================================
            # STATUS
            # =========================================

            echo "📋 PM2 STATUS"

            pm2 status

            # =========================================
            # FINAL
            # =========================================

            echo ""
            echo "========================================="
            echo "✅ NEXT.JS ADMIN DEPLOY SUCCESSFUL"
            echo "========================================="