name: Deploy Admin Next.js

on:
  push:
    branches:
      - next-faizy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.10

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          # Better: use an SSH key instead of a password
          # key: ${{ secrets.SSH_KEY }}

          command_timeout: 20m

          script: |
            set -e

            echo "========================================="
            echo "🚀 START NEXT.JS ADMIN DEPLOY"
            echo "========================================="

            # ---------- NODE ----------
            export NODE_HOME="/root/.nvm/versions/node/v22.23.2"
            export PATH="$NODE_HOME/bin:$PATH"

            node -v
            npm -v

            # ---------- PROJECT DIRECTORY ----------
            APP_DIR="/var/www/magbeeadmin.magaritatech.com"

            if [ ! -d "$APP_DIR" ]; then
              echo "❌ Application directory not found: $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"
            pwd

            # ---------- GIT ----------
            echo "📥 Pull latest code"

            git config --global --add safe.directory "$APP_DIR"
            git fetch origin
            git reset --hard origin/next-faizy

            echo "📌 Current commit:"
            git log -1 --oneline

            # ---------- ENV CHECK ----------
            if [ ! -f ".env" ]; then
              echo "❌ ERROR: .env file not found"
              exit 1
            fi

            echo "✅ .env exists"

            # ---------- STOP APP BEFORE CLEANING ----------
            echo "⏹ Stopping app before cleanup"
            pm2 stop admin-next || true

            echo "🧹 Cleaning old build"
            rm -rf .next node_modules

            # ---------- INSTALL ----------
            echo "📦 Installing dependencies"

            if [ -f "package-lock.json" ]; then
              npm ci
            else
              npm install
            fi

            echo "✅ Dependencies installed"

            # ---------- BUILD ----------
            echo "🏗 Building Next.js app"

            NODE_OPTIONS="--max-old-space-size=4096" npm run build

            echo "✅ Next.js build completed"

            # ---------- VERIFY BUILD ----------
            if [ ! -d ".next" ]; then
              echo "❌ .next directory not found"
              exit 1
            fi

            if [ ! -f ".next/BUILD_ID" ]; then
              echo "❌ .next/BUILD_ID not found"
              exit 1
            fi

            echo "✅ Next.js build verified"

            # ---------- PM2 (fresh start) ----------
            echo "🔄 Starting PM2 process"

            pm2 delete admin-next || true

            pm2 start npm \
              --name "admin-next" \
              --cwd "$APP_DIR" \
              -- start

            pm2 save --force

            echo "📋 PM2 STATUS"
            pm2 status

            # ---------- HEALTH CHECK (no curl, uses node fetch) ----------
            echo "🔍 Checking Next.js application"

            for i in $(seq 1 20); do
              CODE=$(node -e "fetch('http://127.0.0.1:3000/',{redirect:'manual'}).then(r=>console.log(r.status)).catch(()=>console.log(0))")
              echo "Attempt $i: HTTP $CODE"

              if [[ "$CODE" =~ ^(200|301|302|307|308)$ ]]; then
                echo "✅ Next.js application is responding"
                break
              fi

              if [ "$i" -eq 20 ]; then
                echo "❌ Health check failed"
                pm2 status
                pm2 logs admin-next --lines 50 --nostream
                exit 1
              fi

              sleep 3
            done

            echo ""
            echo "========================================="
            echo "✅ NEXT.JS ADMIN DEPLOY SUCCESSFUL"
            echo "========================================="